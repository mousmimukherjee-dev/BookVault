<div class="container py-5"> <div class="row justify-content-center"> <div class="col-12 col-md-8 col-lg-6">

  <div class="card border-secondary shadow">
    <div class="card-body p-4">

      <h2 class="fw-bold mb-2">
        <i class="fa-solid fa-pen-to-square text-primary me-2"></i>
        Edit Book
      </h2>

      <p class="text-secondary mb-4">
        Update the details of your book.
      </p>

      <form (ngSubmit)="save()">

        <div class="mb-3">
          <label for="title" class="form-label">
            Title
          </label>

          <input
            type="text"
            id="title"
            name="title"
            [(ngModel)]="newBook.title"
            class="form-control border-secondary"
            placeholder="Enter book title"
          />
        </div>

        <div class="mb-3">
          <label for="author" class="form-label">
            Author
          </label>

          <input
            type="text"
            id="author"
            name="author"
            [(ngModel)]="newBook.author"
            class="form-control border-secondary"
            placeholder="Enter author name"
          />
        </div>

        <div class="mb-3">
          <label for="publicationDate" class="form-label">
            Publication Date
          </label>

          <input
            type="date"
            id="publicationDate"
            name="publicationDate"
            [(ngModel)]="newBook.publicationDate"
            class="form-control border-secondary"
          />
        </div>

        <small class="text-secondary d-block mb-4">
          Update the information and save your changes.
        </small>

        <div class="d-flex justify-content-end gap-2">

          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="cancel()"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="btn btn-primary"
          >
            <i class="fa-solid fa-floppy-disk me-2"></i>
            Save Changes
          </button>

        </div>

      </form>

    </div>
  </div>

</div>

</div> </div>
